<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#222" />
        </pattern>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#grad)"/>
    
    <!-- Dot Grid Overlay -->
    <rect width="100%" height="100%" fill="url(#dotGrid)" opacity="0.3"/>

    <!-- Concentric Circles (Bottom Right) -->
    <g transform="translate(300, 100)" opacity="0.1" stroke="#fff" stroke-width="1" fill="none">
        <circle cx="0" cy="0" r="40" />
        <circle cx="0" cy="0" r="50" />
        <circle cx="0" cy="0" r="60" />
        <circle cx="0" cy="0" r="70" />
        <circle cx="0" cy="0" r="80" />
        <circle cx="0" cy="0" r="90" />
    </g>

    <!-- Concentric Circles (Top Left) -->
    <g transform="translate(0, 0)" opacity="0.1" stroke="#fff" stroke-width="1" fill="none">
        <circle cx="0" cy="0" r="60" />
        <circle cx="0" cy="0" r="80" />
        <circle cx="0" cy="0" r="100" />
        <circle cx="0" cy="0" r="120" />
    </g>

    <!-- Geometric Shapes -->
    <path d="M50 80 L150 20" stroke="#333" stroke-width="2" opacity="0.5" />
    <circle cx="200" cy="40" r="5" stroke="#333" fill="none" opacity="0.5"/>
    <rect x="250" y="80" width="10" height="10" stroke="#333" fill="none" transform="rotate(45 255 85)" opacity="0.5"/>
</svg>
