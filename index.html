<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alfarizi - Portfolio</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- RemixIcon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    body {
      background-color: #050505 !important;
      font-family: 'Inter', sans-serif;
    }

    .bento-card {
      background-color: #111;
      border: 1px solid #222;
    }

    .social-btn {
      background-color: #111;
      border: 1px solid #222;
      color: #777;
      border-radius: 20px;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.5rem, 4vw, 3rem);
      /* Responsive Icon Size */
      transition: all 0.2s;
      width: 100%;
    }

    .social-btn:hover {
      color: #fff;
      border-color: #444;
      background-color: #161616;
    }

    .service-pill {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ccc;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
    }

    .tool-icon {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #fff;
    }

    /* Custom Colors for Tools */
    .notion {
      background: #222;
      color: #fff;
    }

    .figma {
      background: #1e1e1e;
      border: 1px solid #333;
    }

    .webflow {
      background: #14354c;
      color: #4db3ff;
    }

    .ai {
      background: #330000;
      color: #ff9a00;
      border: 1px solid #ff9a00;
    }

    .framer {
      background: #000;
      color: #fff;
      border: 1px solid #333;
    }
  </style>
</head>

<body class="py-5 d-flex align-items-center min-vh-100">

  <div class="container" style="max-width: 900px;">

    <!-- Row 1: Intro + Avatar -->
    <div class="row g-3 mb-3">
      <div class="col-md-9">
        <div
          class="card h-100 rounded-5 border-secondary border-opacity-10 bento-card p-4 p-md-5 d-flex flex-column justify-content-center">
          <h1 class="display-5 fw-medium text-white mb-2">Hey, I'm Alfarizi</h1>
          <p class="text-secondary fs-5 m-0">Logo/Brand Designer @Me</p>
        </div>
      </div>
      <div class="col-md-3">
        <div
          class="card h-100 rounded-5 border-secondary border-opacity-10 bento-card p-3 d-flex align-items-center justify-content-center position-relative overflow-hidden">
          <!-- Placeholder Memoji -->
          <img
            src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80"
            class="rounded-circle object-fit-cover" style="width: 100px; height: 100px; filter: grayscale(20%);"
            alt="Avatar">
          <span class="position-absolute bottom-0 end-0 m-3 fs-2">✌️</span>
        </div>
      </div>
    </div>

    <!-- Row 2: Socials (5 Columns) -->
    <div class="row row-cols-5 g-3 mb-3">
      <div class="col">
        <a href="#" class="social-btn"><i class="ri-linkedin-fill"></i></a>
      </div>
      <div class="col">
        <a href="#" class="social-btn"><i class="ri-instagram-fill"></i></a>
      </div>
      <div class="col">
        <a href="#" class="social-btn"><i class="ri-tiktok-fill"></i></a>
      </div>
      <div class="col">
        <a href="#" class="social-btn"><i class="ri-facebook-circle-fill"></i></a>
      </div>
      <div class="col">
        <a href="#" class="social-btn"><i class="ri-article-fill"></i></a>
      </div>
    </div>

    <!-- Row 3: Works + Services -->
    <div class="row g-3 mb-3">
      <!-- Recent Works (Larger) -->
      <div class="col-md-8">
        <div
          class="card h-100 rounded-5 border-secondary border-opacity-10 bento-card p-4 overflow-hidden position-relative"
          style="min-height: 280px;">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <span class="text-secondary">Recent Works</span>
            <i class="ri-arrow-right-up-line text-secondary"></i>
          </div>
          <!-- Mockup Images Stacked -->
          <div class="d-flex gap-3 position-absolute bottom-0 start-0 w-100 p-4" style="transform: translateY(20%);">
            <div class="bg-body-secondary rounded-3" style="width: 150px; height: 100px; transform: rotate(-5deg);">
            </div>
            <div class="bg-light rounded-3 shadow" style="width: 180px; height: 120px; z-index: 2;"></div>
            <div class="bg-body-secondary rounded-3" style="width: 150px; height: 100px; transform: rotate(5deg);">
            </div>
          </div>
        </div>
      </div>

      <!-- Services (Smaller) -->
      <div class="col-md-4">
        <div class="card h-100 rounded-5 border-secondary border-opacity-10 bento-card p-4">
          <span class="text-secondary mb-3 d-block">Services</span>
          <div class="d-flex flex-wrap gap-2 justify-content-center align-content-center h-75">
            <span class="service-pill" style="transform: rotate(-5deg);">Branding</span>
            <span class="service-pill" style="transform: rotate(3deg);">Logo Design</span>
            <span class="service-pill" style="transform: rotate(-2deg);">UI/UX</span>
            <span class="service-pill" style="transform: rotate(5deg);">Packaging</span>
            <span class="service-pill" style="transform: rotate(-3deg);">Identity</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Row 4: Tools + Collab -->
    <div class="row g-3">
      <!-- Tools (Smaller) -->
      <div class="col-md-4">
        <div class="card h-100 rounded-5 border-secondary border-opacity-10 bento-card p-4">
          <span class="text-secondary mb-4 d-block">Tools I use</span>
          <div class="d-flex flex-wrap gap-3 justify-content-center">
            <div class="tool-icon notion"><i class="ri-sticky-note-fill"></i></div>
            <div class="tool-icon figma"><i class="ri-pen-nib-fill"></i></div>
            <div class="tool-icon ai">Ai</div>
            <div class="tool-icon webflow"><i class="ri-code-s-slash-fill"></i></div>
            <div class="tool-icon framer"><i class="ri-layout-fill"></i></div>
          </div>
        </div>
      </div>

      <!-- Collab (Larger) -->
      <div class="col-md-8">
        <div
          class="card h-100 rounded-5 border-secondary border-opacity-10 bento-card p-5 d-flex flex-column justify-content-center align-items-start">
          <h2 class="display-6 fw-medium text-white mb-2">Let's collab!</h2>
          <p class="text-secondary mb-4">Let's turn your idea into reality with my design experience!</p>
          <a href="#" class="btn btn-light rounded-pill px-4 py-2 fw-medium d-flex align-items-center gap-2">
            Send a message now! <i class="ri-arrow-right-line"></i>
          </a>
        </div>
      </div>
    </div>

  </div>

  <!-- Bootstrap 5.3.8 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
